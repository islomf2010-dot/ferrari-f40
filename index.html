<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta
      name="description"
      content="Ferrari F40 — a scroll-driven 3D study. Scroll to move the camera through the F40's form, its engineering and its legacy."
    />
    <title>FERRARI F40 — Born To Be Unforgettable</title>
    <style>
      html,
      body {
        margin: 0;
        background: #070708;
      }
      /* First-paint curtain: replaced by the React loader, prevents a white flash. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        background: #070708;
        transition: opacity 0.6s ease;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
